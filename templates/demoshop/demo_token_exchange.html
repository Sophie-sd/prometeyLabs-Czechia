<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Přístup k demo administraci — {{ demo_shop.name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0A0A0A;
            color: #EDEDED;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1A1A1A;
            border: 1px solid #2C2C2C;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #FFF;
        }
        p {
            color: #B0B0B0;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid #2C2C2C;
            border-top-color: #E65100;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #2C2C2C;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Přístup k administraci</h1>
        <p>Ověřování přístup k demo obchodu <strong>{{ demo_shop.name }}</strong>.<br>
        Budete automaticky přesměrováni...</p>
        
        <form id="exchangeForm" method="post" action="{{ exchange_url }}">
            {% csrf_token %}
            <input type="hidden" name="one_time_token" value="{{ one_time_token }}">
        </form>
        
        <div class="footer">
            <p>Tento odkaz je platný po dobu 90 sekund a lze jej použít pouze jednou.</p>
        </div>
    </div>
    
    <script>
        // Auto-submit form after 500ms
        setTimeout(function() {
            document.getElementById('exchangeForm').submit();
        }, 500);
    </script>
</body>
</html>
