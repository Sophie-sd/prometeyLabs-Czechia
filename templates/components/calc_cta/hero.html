{% load static %}{% if part != 'micro' %}<link rel="stylesheet" href="{% static 'css/components/calc-cta.css' %}?v=3">{% endif %}{% if part == 'block' %}<div class="pl-calc-cta pl-calc-cta--{{ page }}" data-calc-cta-hero>
    <a href="{{ href }}" class="pl-calc-cta__btn mobile-touch-target" data-calc-cta="hero" data-calc-page="{{ page }}"{% if scroll_target %} data-calc-scroll="{{ scroll_target }}"{% endif %}><span class="pl-calc-cta__label">{{ label }}</span><span class="pl-calc-cta__arrow" aria-hidden="true">→</span></a>
    <p class="pl-calc-cta__micro">{{ micro }}</p>
</div>{% elif part == 'btn' %}<a href="{{ href }}" class="pl-calc-cta__btn pl-calc-cta__btn--inline pl-calc-cta--{{ page }} mobile-touch-target" data-calc-cta="hero" data-calc-cta-hero data-calc-page="{{ page }}"{% if scroll_target %} data-calc-scroll="{{ scroll_target }}"{% endif %}><span class="pl-calc-cta__label">{{ label }}</span><span class="pl-calc-cta__arrow" aria-hidden="true">→</span></a>{% else %}<p class="pl-calc-cta__micro pl-calc-cta__micro--row">{{ micro }}</p>{% endif %}
