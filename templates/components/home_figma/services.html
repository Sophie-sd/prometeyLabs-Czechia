{% load i18n %}
<section class="hf-services hf-wrap" id="services" aria-labelledby="hf-services-title">
    <h2 class="hf-h2" id="hf-services-title">{% trans "Послуги" %}<br><span class="hf-accent">PrometeyLabs</span></h2>
    <p class="hf-services__hint">{% trans "Наведіть, щоб дізнатися більше" %}</p>
    <div class="hf-services__list">
        <button type="button" class="hf-card hf-service" data-modal="service-web-modal">
            <span class="hf-service__title">{% trans "Web-розробка" %}</span>
            <span class="hf-service__quote">{% trans "Сайти під ключ, лендінги, інтернет-магазини, веб-додатки, телеграм-боти" %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-mobile-modal">
            <span class="hf-service__title">{% trans "Мобільні застосунки" %}</span>
            <span class="hf-service__quote">{% trans "iOS та Android додатки з сучасним дизайном" %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-smm-modal">
            <span class="hf-service__title">{% trans "Реклама та ведення соціальних мереж" %}</span>
            <span class="hf-service__quote">{% trans "Google Ads, Meta Ads, TikTok Ads, SMM, контент" %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-ai-modal">
            <span class="hf-service__title">{% trans "Автоматизація AI" %}</span>
            <span class="hf-service__quote">{% trans "Інтегруємо ШІ у сайт, CRM та процеси — від AI-консультантів до автоматизації рутини." %}</span>
        </button>
    </div>
</section>
