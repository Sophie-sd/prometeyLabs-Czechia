<a href="{% url 'portfolio' %}" class="project-story v3-client{% if is_clone %} story-clone{% endif %}"{% if is_clone %} data-clone="true" aria-hidden="true" tabindex="-1"{% else %} role="listitem" aria-label="{{ client.name }}"{% endif %}>
    <div class="v3-client-halo" aria-hidden="true"></div>
    <div class="v3-client-ring">
        <div class="v3-client-inner">
            {% if client.get_logo_url %}
            <picture>
                {% if client.get_logo_webp_228_url %}<source type="image/webp" srcset="{{ client.get_logo_webp_228_url }} 1x{% if client.get_logo_webp_456_url %}, {{ client.get_logo_webp_456_url }} 2x{% endif %}">{% endif %}
                <img src="{{ client.get_logo_url }}" alt="{% if is_clone %}{% else %}{{ client.name }}{% endif %}" width="296" height="296" loading="{% if is_clone %}lazy{% else %}eager{% endif %}" decoding="async">
            </picture>
            {% endif %}
        </div>
    </div>
    <span class="project-story-name v3-client-name">{{ client.name }}</span>
</a>
