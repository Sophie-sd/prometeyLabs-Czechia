{% if ads_faq %}
<section class="pl-ads-faq" id="faq" aria-labelledby="pl-ads-faq-title">
    <div class="pl-ads-wrap">
        <h2 class="pl-ads-h2" id="pl-ads-faq-title">{{ ads_copy.faq_h2 }}</h2>
        <div class="pl-ads-faq__list">
            {% for item in ads_faq %}
            <details class="pl-ads-faq__item">
                <summary class="pl-ads-faq__q">{{ item.q }}</summary>
                <p class="pl-ads-faq__a">{{ item.a }}</p>
            </details>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
