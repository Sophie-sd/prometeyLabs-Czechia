{% extends 'payment/base_payment.html' %}

{% block title %}{{ t.inactive_title }}{% endblock %}

{% block content %}
<div class="pay-status">
    <div class="pay-status-icon">🔒</div>
    <h1 class="pay-status-title">{{ t.inactive_title }}</h1>
    <p class="pay-status-text">{% if is_paid %}{{ t.inactive_paid_text }}{% else %}{{ t.inactive_text }}{% endif %}</p>
</div>
{% endblock %}
