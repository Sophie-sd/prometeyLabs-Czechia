{# Consent checkboxes (Art. 16 CRD / §1837 NOZ). Texts: admin -> PaymentText. #}
<div class="pay-consent">

        <input type="checkbox" name="withdrawal_waiver" value="1" required>
        <span class="pay-consent-text">{{ t.consent_withdrawal }}</span>

        <span class="pay-consent-text">{{ consent_data_html }}</span>
    </label>
</div>
